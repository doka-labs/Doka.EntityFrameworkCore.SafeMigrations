version: 2
updates:
  # Central Package Management defines dependency ranges; all 24 repository
  # projects retain reviewed default-profile locks, including execution projects.
  # RID, compatibility-matrix and isolated package profiles have separate graphs;
  # their temporary locks are generated and then validated in their own workspaces.
  # D-006 retains the earlier five-shipping-lock policy as history and records
  # the expanded current reproducibility boundary.
  # Group normal updates so one pull request exercises the complete
  # qualification matrix. Three days leave time for early release feedback
  # without requiring a full week's minimum age. Security updates are not delayed.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - .NET

  # Workflow actions are SHA-pinned. Dependabot therefore proposes the new
  # immutable revision while the pull request keeps the reviewable release tag
  # comment and passes the same repository gates as source changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github_actions

  # global.json is the immutable build and publication toolchain contract.
  # SDK changes must therefore arrive as reviewable pull requests and pass the
  # exact-version, release-evidence, and repository gates.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - .NET
