name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Full qualification
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
      artifact-name: safe-migrations-ci-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-retention-days: 14
      require-stable-dependencies: false
