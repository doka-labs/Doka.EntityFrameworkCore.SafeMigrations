name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      capture-sqlserver-baseline:
        description: Retain measurement-only SQL Server baseline evidence on the qualification runner.
        required: false
        default: false
        type: boolean
      dependency-review-pr:
        description: Review this PR through the shared pipeline from its reviewed same-repository head branch.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Full qualification
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
      artifact-name: safe-migrations-ci-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-retention-days: 14
      capture-sqlserver-baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.capture-sqlserver-baseline }}

  dependency-review-startup:
    name: Dependency review startup
    # Only a maintainer's explicit dispatch opts in. Normal PR qualification
    # stays read-only, and this job cannot substitute a skipped required check.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-review-pr != '' }}
    uses: ./.github/workflows/dependency-review-results.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: write
    with:
      dependency-review-pr: ${{ inputs.dependency-review-pr }}
