name: CI
run-name: ${{ inputs.maintenance && format('maintenance {0}', inputs.schedule-correlation) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance:
        description: Execute this active line's scheduled qualification with exact source binding.
        required: false
        default: false
        type: boolean
      schedule-correlation:
        description: Identity issued by the release-line maintenance coordinator.
        required: false
        default: ''
        type: string
      schedule-source-sha:
        description: Exact branch head frozen by the maintenance coordinator.
        required: false
        default: ''
        type: string
      capture-benchmark-evidence:
        description: Explicitly run native BenchmarkDotNet Dry measurements for all five suites.
        required: false
        default: false
        type: boolean
      capture-sqlserver-baseline:
        description: Retain a SQL Server BenchmarkDotNet Short run on the qualification runner.
        required: false
        default: false
        type: boolean
      dependency-review-pr:
        description: Review this PR through the shared pipeline from its reviewed same-repository head branch.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Review-only dispatches must not cancel qualification on the same branch.
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'workflow_dispatch' && inputs.dependency-review-pr != ''
      && format('dependency-review-{0}', inputs.dependency-review-pr)
      || inputs.maintenance && inputs.schedule-correlation || 'normal' }}
  cancel-in-progress: true

jobs:
  schedule-identity:
    name: schedule-identity
    runs-on: ubuntu-26.04
    outputs:
      review_only: ${{ steps.mode.outputs.review_only }}
    steps:
      - name: Select CI execution mode
        id: mode
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          REVIEW_PR: ${{ inputs.dependency-review-pr }}
          MAINTENANCE: ${{ inputs.maintenance }}
          CAPTURE_BENCHMARKS: ${{ inputs.capture-benchmark-evidence }}
          CAPTURE_SQLSERVER: ${{ inputs.capture-sqlserver-baseline }}
        run: |
          review_only=false
          if [[ "$CI_EVENT_NAME" == 'workflow_dispatch' && -n "$REVIEW_PR" ]]; then
            if [[ "$MAINTENANCE" == 'true' || "$CAPTURE_BENCHMARKS" == 'true' ||
                  "$CAPTURE_SQLSERVER" == 'true' ]]; then
              printf 'Dependency review cannot be combined with maintenance or benchmark capture.\n' >&2
              exit 1
            fi

            review_only=true
          fi

          printf 'review_only=%s\n' "$review_only" >> "$GITHUB_OUTPUT"

      - name: Ordinary feature and PR checks remain nonpublishing
        if: ${{ !inputs.maintenance }}
        run: 'true'
      - name: Checkout the branch-native maintenance guard
        if: inputs.maintenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact active scheduled source
        if: inputs.maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MAINTENANCE: ${{ inputs.maintenance }}
          INPUT_CORRELATION: ${{ inputs.schedule-correlation }}
          INPUT_SOURCE_SHA: ${{ inputs.schedule-source-sha }}
        run: python3 -m eng.release.maintenance guard --workflow ci.yml

  quality-gates:
    name: Full qualification
    needs: schedule-identity
    # Skip the reusable caller, never its independently required nested result.
    if: ${{ needs.schedule-identity.outputs.review_only != 'true' }}
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
      artifact-name: safe-migrations-ci-${{ github.run_id }}-${{ github.run_attempt }}
      artifact-retention-days: 14
      capture-benchmark-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.capture-benchmark-evidence }}
      capture-sqlserver-baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.capture-sqlserver-baseline }}

  dependency-review-startup:
    name: Dependency review startup
    needs: schedule-identity
    # Only a maintainer's explicit dispatch opts in. Normal PR qualification
    # stays read-only, and this job cannot substitute a skipped required check.
    if: ${{ needs.schedule-identity.outputs.review_only == 'true' }}
    uses: ./.github/workflows/dependency-review-results.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: write
    with:
      dependency-review-pr: ${{ inputs.dependency-review-pr }}
