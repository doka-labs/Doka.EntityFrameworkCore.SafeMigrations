name: dependency-review

# A read-only PR event requests the default-branch receiver, including for forks
# and Dependabot. It supplies no code or dependency graph to the write workflow.
on:
  pull_request:
    # WHY: Registered inactive lines need preparation PR checks before activation.
    # The trusted receiver independently rejects unregistered target bases.

permissions: {}

jobs:
  request-dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Request independent dependency resolution
        run: echo 'The trusted receiver will resolve and review both exact revisions.'
