name: dependency-review

# Reviews the resolved dependency delta before a pull request can merge.
# GitHub Automatic Dependency Submission owns the NuGet snapshots; the
# official review action owns bounded retries while those snapshots propagate.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A newer revision supersedes the dependency verdict for the same pull
  # request. Automatic submissions remain independent and are not cancelled.
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The allowlist is the repository's dependency-license policy. Missing
      # package metadata remains visible in the summary and is never treated
      # as proof that an otherwise unapproved license is acceptable.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            Unlicense
          comment-summary-in-pr: never
          show-openssf-scorecard: true
          # Snapshot warnings remain fail-closed after the action's bounded
          # retry through the explicit header check below. No second polling
          # state machine is introduced.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180

      # v5.0.0 proceeds after its retry timeout even when GitHub still returns
      # snapshot warnings. Query the same comparison endpoint once more and
      # require its warning header to be present and empty before this gate can
      # report success. GitHub's public REST reference did not specify this
      # header on 2026-08-28; the pinned action source consumes it directly.
      # A vendor-side removal therefore remains an explicit fail-closed event.
      - name: Require complete dependency snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          response_headers="$(mktemp)"
          trap 'rm -f "$response_headers"' EXIT

          gh api --include \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}?per_page=100" \
            --jq empty >"$response_headers"

          bash eng/verify-dependency-snapshot-headers.sh "$response_headers"
