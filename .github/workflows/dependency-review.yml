name: dependency-review

# Contributor restore hooks run only in this unprivileged PR context, including
# forks and Dependabot. The receiver consumes exact immutable data artifacts.
on:
  pull_request:
    # WHY: Registered inactive lines need preparation PR checks before activation.
    # The trusted receiver independently rejects unregistered target bases.

permissions: {}

jobs:
  prepare-base:
    permissions:
      contents: read
    cache-mode: none
    uses: ./.github/workflows/dependency-snapshot.yml
    with:
      sha: ${{ github.event.pull_request.base.sha }}
      revision: base

  prepare-head:
    permissions:
      contents: read
    cache-mode: none
    uses: ./.github/workflows/dependency-snapshot.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      revision: head

  request-dependency-review:
    needs: [prepare-base, prepare-head]
    runs-on: ubuntu-26.04
    cache-mode: none
    timeout-minutes: 1
    steps:
      - name: Request independent dependency resolution
        run: echo 'Both exact dependency revisions are ready for independent data-only review.'
