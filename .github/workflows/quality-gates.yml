name: Quality gates

on:
  workflow_call:
    outputs:
      qualified-artifact-name:
        description: Exact immutable artifact produced by this qualification attempt.
        value: ${{ jobs.package-and-core.outputs.qualified-artifact-name }}
    inputs:
      package-version:
        description: Version assigned to qualified SafeMigrations packages.
        required: true
        type: string
      artifact-name:
        description: Immutable workflow artifact containing packages and evidence.
        required: true
        type: string
      artifact-retention-days:
        description: Retention period for qualification evidence.
        required: false
        default: 14
        type: number
      capture-sqlserver-baseline:
        description: Capture diagnostic medians in addition to informational benchmark reports.
        required: false
        default: false
        type: boolean
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  DOKA_PACKAGE_SOURCE: https://api.nuget.org/v3/index.json
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0

jobs:
  package-and-core:
    name: Core, performance, packages, and SBOM
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      qualified-artifact-name: ${{ steps.artifact-identity.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify engineering scripts
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find eng -type f -name '*.sh' -print0)
          bash eng/tests/test-dependency-snapshot-headers.sh
          python3 -m unittest eng/tests/test_dependency_license_exceptions.py -v
          python3 -m unittest eng/tests/test_dependency_snapshot_inputs.py -v
          python3 -m unittest eng/tests/test_dependency_review_workflow.py -v
          python3 -m unittest eng/tests/test_dependency_review_handoff.py -v
          python3 -m unittest eng/tests/test_parallel_test_configuration.py -v
          python3 -m unittest eng/tests/test_runner_configuration.py -v
          python3 -m unittest eng/tests/test_workflow_schema_compatibility.py -v
          python3 -m unittest eng/tests/test_verify_package_contents.py -v
          python3 -m unittest eng/tests/test_verify_package_consumer_sources.py -v
          bash eng/tests/test-dependency-maintenance.sh
          bash eng/tests/test-github-release-reconciliation.sh
          bash eng/tests/test-pre-tag-check.sh
          bash eng/tests/test-release-provenance.sh
          bash eng/tests/test-release-version.sh
          python3 -m unittest eng/tests/test_verify_coverage.py -v
          python3 -m unittest eng/tests/test_verify_sqlserver_trx.py -v
          python3 -m unittest eng/tests/test_verify_sqlserver_tooling.py -v
          python3 -m unittest \
            eng/tests/test_release_lines.py eng/tests/test_release_publication.py \
            eng/tests/test_release_latest.py eng/tests/test_release_line_maintenance.py \
            eng/tests/test_release_line_workflow.py eng/tests/test_release_line_flow.py \
            eng/tests/test_release_line_recovery.py eng/tests/test_release_line_matrix.py \
            eng/tests/test_release_line_dependency_bounds.py -v
          python3 eng/verify-workflow-concurrency.py
          python3 -m eng.release.maintenance check-dependencies

      - name: Restore repository dependency graph
        run: >-
          dotnet restore Doka.EntityFrameworkCore.SafeMigrations.slnx
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Verify warning-level code style
        run: >-
          dotnet format Doka.EntityFrameworkCore.SafeMigrations.slnx style
          --severity warn --verify-no-changes --no-restore

      - name: Verify unnecessary imports
        run: >-
          dotnet format Doka.EntityFrameworkCore.SafeMigrations.slnx style
          --diagnostics IDE0005 --severity hidden
          --verify-no-changes --no-restore

      - name: Release build
        run: >-
          dotnet build Doka.EntityFrameworkCore.SafeMigrations.slnx
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Core tests
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.Tests/Doka.EntityFrameworkCore.SafeMigrations.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --logger "trx;LogFileName=core-tests.trx" -m:1 /nodeReuse:false

      - name: Capture SQL Server performance baseline evidence
        if: ${{ inputs.capture-sqlserver-baseline }}
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --capture-baseline --output artifacts/performance/sqlserver-baseline.json

      - name: Upload SQL Server baseline evidence
        if: ${{ always() && inputs.capture-sqlserver-baseline }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlserver-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance/sqlserver-baseline.json
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}

      # Budget overruns are evidence, not CI failures on shared runner hardware.
      # Report-only preserves fatal configuration, execution and output errors.
      - name: Core performance and allocation report
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --report-only --output artifacts/performance/core-results.json

      - name: MySQL and MariaDB performance and allocation report
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.MySql.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.MySql.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --report-only --output artifacts/performance/mysql-results.json

      - name: PostgreSQL performance and allocation report
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --report-only --output artifacts/performance/postgresql-results.json

      - name: SQLite performance and allocation report
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --report-only --output artifacts/performance/sqlite-results.json

      - name: SQL Server performance and allocation report
        run: >-
          dotnet run
          --project benchmarks/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Benchmarks/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Benchmarks.csproj
          --configuration Release --no-build --no-restore --
          --report-only --output artifacts/performance/sqlserver-results.json

      - name: Qualify reproducible packages
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          mkdir -p artifacts/packages
          eng/qualify-packages.sh \
            --version "$PACKAGE_VERSION" \
            --output artifacts/packages \
            --doka-source "$DOKA_PACKAGE_SOURCE"

      - name: Generate and validate SPDX SBOM
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          mkdir -p artifacts/sbom
          eng/generate-sbom.sh \
            --package-dir artifacts/packages \
            --output artifacts/sbom \
            --version "$PACKAGE_VERSION"

      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}

      - name: Record qualified artifact identity
        id: artifact-identity
        env:
          QUALIFIED_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: echo "name=$QUALIFIED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload qualified packages and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            artifacts/packages
            artifacts/performance
            artifacts/sbom
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  coverage:
    name: Merged product coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      SAFE_MIGRATIONS_MYSQL_ENGINE: mariadb
      SAFE_MIGRATIONS_MYSQL_VERSION: 12.3.3
      SAFE_MIGRATIONS_MYSQL_IMAGE: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
      SAFE_MIGRATIONS_POSTGRES_VERSION: 18.6
      SAFE_MIGRATIONS_POSTGRES_IMAGE: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
      SAFE_MIGRATIONS_SQLSERVER_VERSION: '2022'
      SAFE_MIGRATIONS_SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    steps:
      - name: Require supported x86-64 host
        run: test "$(uname -m)" = x86_64

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore repository dependency graph
        run: >-
          dotnet restore Doka.EntityFrameworkCore.SafeMigrations.slnx
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Release build
        run: >-
          dotnet build Doka.EntityFrameworkCore.SafeMigrations.slnx
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Collect Core coverage
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.Tests/Doka.EntityFrameworkCore.SafeMigrations.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --collect "Code Coverage;Format=cobertura"
          --results-directory artifacts/coverage/core -m:1 /nodeReuse:false

      # Every live engine matrix cell below runs LargeScale. Coverage excludes
      # the same test to avoid duplicating live executions in the provider cells.
      - name: Collect MySQL and MariaDB adapter coverage
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --collect "Code Coverage;Format=cobertura"
          --filter "Category!=LargeScale"
          --results-directory artifacts/coverage/mysql -m:1 /nodeReuse:false

      - name: Collect PostgreSQL adapter coverage
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --collect "Code Coverage;Format=cobertura"
          --filter "Category!=LargeScale"
          --results-directory artifacts/coverage/postgresql -m:1 /nodeReuse:false

      - name: Collect SQLite adapter coverage
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --collect "Code Coverage;Format=cobertura"
          --filter "Category!=LargeScale"
          --results-directory artifacts/coverage/sqlite -m:1 /nodeReuse:false

      - name: Collect SQL Server adapter coverage
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --collect "Code Coverage;Format=cobertura"
          --filter "Category!=LargeScale"
          --results-directory artifacts/coverage/sqlserver -m:1 /nodeReuse:false

      - name: Enforce merged product coverage
        run: >-
          python3 eng/verify-coverage.py
          --reports-root artifacts/coverage
          --thresholds-file eng/coverage-thresholds.json

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  mysql-engine:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            version: 8.4.13
            image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
          - engine: mysql
            version: 9.7.4
            image: mysql:9.7.4@sha256:8fb11c38b3551e22d50adbb688f027f8ff4ea2d2445aa277c1cc97b4af85ec54
          - engine: mariadb
            version: 10.11.19
            image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
          - engine: mariadb
            version: 11.4.13
            image: mariadb:11.4.13@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
          - engine: mariadb
            version: 11.8.9
            image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
          - engine: mariadb
            version: 12.3.3
            image: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    env:
      SAFE_MIGRATIONS_MYSQL_ENGINE: ${{ matrix.engine }}
      SAFE_MIGRATIONS_MYSQL_VERSION: ${{ matrix.version }}
      SAFE_MIGRATIONS_MYSQL_IMAGE: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore repository dependency graph
        run: >-
          dotnet restore
          tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests.csproj
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Release build
        run: >-
          dotnet build
          tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests.csproj
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Integration tests
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests/Doka.EntityFrameworkCore.SafeMigrations.MySql.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --logger "trx;LogFileName=$SAFE_MIGRATIONS_MYSQL_ENGINE-$SAFE_MIGRATIONS_MYSQL_VERSION.trx"
          -m:1 /nodeReuse:false

      - name: EF CLI, scripts, and bundle
        run: >-
          eng/verify-ef-tooling.sh
          "$SAFE_MIGRATIONS_MYSQL_ENGINE"
          "$SAFE_MIGRATIONS_MYSQL_IMAGE"
          "$SAFE_MIGRATIONS_MYSQL_VERSION"

      - name: Upload test and tooling evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.engine }}-${{ matrix.version }}-evidence-${{ github.run_attempt }}
          path: |
            **/TestResults/*.trx
            artifacts/ef-tooling/${{ matrix.engine }}
            artifacts/performance/live
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  postgresql-engine:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14.24
            image: postgres:14.24@sha256:8ab94f61668dc73bbab4dc13273ff2fc37e635536af62aef5306a49a9682a446
          - version: 15.19
            image: postgres:15.19@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
          - version: 16.15
            image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
          - version: 17.11
            image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
          - version: 18.6
            image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    env:
      SAFE_MIGRATIONS_POSTGRES_IMAGE: ${{ matrix.image }}
      SAFE_MIGRATIONS_POSTGRES_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore repository dependency graph
        run: >-
          dotnet restore
          tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests.csproj
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Release build
        run: >-
          dotnet build
          tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests.csproj
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Integration tests
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --logger "trx;LogFileName=postgresql-$SAFE_MIGRATIONS_POSTGRES_VERSION.trx"
          -m:1 /nodeReuse:false

      - name: EF CLI, scripts, and bundle
        run: >-
          eng/verify-ef-tooling.sh
          postgres
          "$SAFE_MIGRATIONS_POSTGRES_IMAGE"
          "$SAFE_MIGRATIONS_POSTGRES_VERSION"

      - name: Upload test and tooling evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgresql-${{ matrix.version }}-evidence-${{ github.run_attempt }}
          path: |
            **/TestResults/*.trx
            artifacts/ef-tooling/postgres
            artifacts/performance/live
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  sqlite-engine:
    name: SQLite
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore repository dependency graph
        run: >-
          dotnet restore
          tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests.csproj
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Release build
        run: >-
          dotnet build
          tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests.csproj
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Integration tests
        run: >-
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers
          --logger "trx;LogFileName=sqlite.trx" -m:1 /nodeReuse:false

      - name: EF CLI and bundle
        run: eng/verify-sqlite-ef-tooling.sh

      - name: Upload test and tooling evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-evidence-${{ github.run_attempt }}
          path: |
            **/TestResults/*.trx
            artifacts/ef-tooling/sqlite
            artifacts/performance/live
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  sqlserver-engine:
    name: SQL Server ${{ matrix.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2019'
            image: mcr.microsoft.com/mssql/server:2019-latest@sha256:07d7dedecdbfcf6776035dc5eefb5bfd9aa1804b2f6b99f7dedb397d8a599069
          - version: '2022'
            image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          - version: '2025'
            image: mcr.microsoft.com/mssql/server:2025-latest@sha256:245f6b1c8903edae52cb20fa31419cefcde1a49938bb8c3447099011fc871ca3
    env:
      SAFE_MIGRATIONS_SQLSERVER_IMAGE: ${{ matrix.image }}
      SAFE_MIGRATIONS_SQLSERVER_VERSION: ${{ matrix.version }}
    steps:
      - name: Require supported x86-64 host
        run: test "$(uname -m)" = x86_64

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore repository dependency graph
        run: >-
          dotnet restore
          tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests.csproj
          --disable-parallel --disable-build-servers -m:1
          /nodeReuse:false

      - name: Release build
        run: >-
          dotnet build
          tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests.csproj
          --configuration Release --no-restore --disable-build-servers -m:1
          /nodeReuse:false -p:ContinuousIntegrationBuild=true

      - name: Integration tests
        run: |
          dotnet test \
            tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests.csproj \
            --configuration Release --no-build --no-restore --disable-build-servers \
            --logger "trx;LogFileName=sqlserver-$SAFE_MIGRATIONS_SQLSERVER_VERSION.trx" \
            -m:1 /nodeReuse:false
          trx="$(find tests/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.Tests/TestResults \
            -type f -name "sqlserver-$SAFE_MIGRATIONS_SQLSERVER_VERSION.trx" -print -quit)"
          test -n "$trx"
          python3 eng/verify-sqlserver-trx.py "$trx"

      - name: EF CLI, scripts, and bundle
        run: >-
          eng/verify-sqlserver-ef-tooling.sh
          "$SAFE_MIGRATIONS_SQLSERVER_IMAGE"
          "$SAFE_MIGRATIONS_SQLSERVER_VERSION"

      - name: Upload test and tooling evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlserver-${{ matrix.version }}-evidence-${{ github.run_attempt }}
          path: |
            **/TestResults/*.trx
            artifacts/ef-tooling/sqlserver
            artifacts/performance/live
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}

  # A failed dependency would skip this job without always(), leaving branch
  # protection without the single fail-closed result it is intended to trust.
  required:
    name: Required
    if: ${{ always() }}
    needs:
      - package-and-core
      - coverage
      - mysql-engine
      - postgresql-engine
      - sqlite-engine
      - sqlserver-engine
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful qualification
        env:
          PACKAGE_AND_CORE_RESULT: ${{ needs.package-and-core.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MYSQL_ENGINE_RESULT: ${{ needs.mysql-engine.result }}
          POSTGRESQL_ENGINE_RESULT: ${{ needs.postgresql-engine.result }}
          SQLITE_ENGINE_RESULT: ${{ needs.sqlite-engine.result }}
          SQLSERVER_ENGINE_RESULT: ${{ needs.sqlserver-engine.result }}
        run: |
          printf 'package-and-core=%s\n' "$PACKAGE_AND_CORE_RESULT"
          printf 'coverage=%s\n' "$COVERAGE_RESULT"
          printf 'mysql-engine=%s\n' "$MYSQL_ENGINE_RESULT"
          printf 'postgresql-engine=%s\n' "$POSTGRESQL_ENGINE_RESULT"
          printf 'sqlite-engine=%s\n' "$SQLITE_ENGINE_RESULT"
          printf 'sqlserver-engine=%s\n' "$SQLSERVER_ENGINE_RESULT"

          if [[ "$PACKAGE_AND_CORE_RESULT" != 'success' ||
                "$COVERAGE_RESULT" != 'success' ||
                "$MYSQL_ENGINE_RESULT" != 'success' ||
                "$POSTGRESQL_ENGINE_RESULT" != 'success' ||
                "$SQLITE_ENGINE_RESULT" != 'success' ||
                "$SQLSERVER_ENGINE_RESULT" != 'success' ]]; then
            printf 'One or more required qualification jobs did not succeed.\n' >&2
            exit 1
          fi
