name: Release candidate
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a leading v, for example 10.0.0-rc.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: safe-migrations-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate untagged candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: bash eng/validate-release-version.sh "$PACKAGE_VERSION"

      - name: Verify current untagged main source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release-tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release candidates must be dispatched from main." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            echo "The dispatched commit is no longer current main." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Candidate qualification must finish before the release tag exists." >&2
            exit 1
          fi

      - name: Require an unused NuGet version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          for package_id in \
            doka.entityframeworkcore.safemigrations \
            doka.entityframeworkcore.safemigrations.mysql \
            doka.entityframeworkcore.safemigrations.postgresql; do
            package_url="https://api.nuget.org/v3-flatcontainer/$package_id/$PACKAGE_VERSION/$package_id.$PACKAGE_VERSION.nupkg"
            http_code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 --output /dev/null \
              --write-out '%{http_code}' "$package_url")"

            if [[ "$http_code" != 404 ]]; then
              echo "NuGet version must be unused; $package_id returned HTTP $http_code." >&2
              exit 1
            fi
          done

  quality-gates:
    name: Full reversible qualification
    needs: preflight
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: ${{ needs.preflight.outputs.package-version }}
      artifact-name: safe-migrations-release-${{ needs.preflight.outputs.package-version }}-${{ github.run_attempt }}
      artifact-retention-days: 30

  attest:
    name: Attest qualified packages
    needs:
      - preflight
      - quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write           # Mints the short-lived Sigstore certificate.
      attestations: write       # Publishes build and SBOM attestations.
      artifact-metadata: write  # Links attestations to workflow artifacts.
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download qualified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.quality-gates.outputs.qualified-artifact-name }}
          path: artifacts

      - name: Verify qualified bytes
        env:
          PACKAGE_VERSION: ${{ needs.preflight.outputs.package-version }}
        run: |
          (
            cd artifacts/packages
            sha256sum --check SHA256SUMS
          )
          eng/verify-package-contents.sh \
            --package-dir artifacts/packages \
            --version "$PACKAGE_VERSION"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS
            artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          sbom-path: artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

  publish:
    name: Verify tag and publish
    needs:
      - preflight
      - quality-gates
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: nuget
    permissions:
      actions: read    # Downloads the exact qualified workflow artifact.
      contents: write  # Creates or verifies the immutable GitHub Release.
      id-token: write  # Exchanges OIDC for a short-lived NuGet API key.
    env:
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package-version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download qualified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.quality-gates.outputs.qualified-artifact-name }}
          path: artifacts

      - name: Verify source and authorized signed tag
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" \
              || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Publication must use the qualified main commit." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The qualified commit is no longer on protected main history." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag \
              || "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "The release tag must be annotated and identify the qualified commit." >&2
            exit 1
          fi

          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile=eng/release/allowed-signers \
            verify-tag "$RELEASE_TAG"

      - name: Verify qualified bytes again
        run: |
          (
            cd artifacts/packages
            sha256sum --check SHA256SUMS
          )
          eng/verify-package-contents.sh \
            --package-dir artifacts/packages \
            --version "$PACKAGE_VERSION"

      - name: Request short-lived NuGet.org key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish primary packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols --skip-duplicate --timeout 300
          done

      - name: Publish symbol packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.snupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate --timeout 300
          done

      - name: Verify public NuGet packages
        run: >-
          bash eng/readback-nuget.sh
          --package-dir artifacts/packages
          --version "$PACKAGE_VERSION"
          --timeout-seconds 1200

      - name: Publish or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS
            artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json
          )
          expected_prerelease=false
          draft_arguments=()
          publication_arguments=(--latest)
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            expected_prerelease=true
            draft_arguments=(--prerelease)
            publication_arguments=(--prerelease --latest=false)
          fi

          awk -v heading="## [$PACKAGE_VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md >release-notes.md

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "SafeMigrations $PACKAGE_VERSION" \
              --notes-file release-notes.md \
              "${draft_arguments[@]}"
          fi

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --json tagName,isDraft,isImmutable,isPrerelease,assets
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag
              and .isPrerelease == $prerelease
              and ((.isDraft == true and .isImmutable == false)
                or (.isDraft == false and .isImmutable == true))' \
            <<<"$release_json" >/dev/null

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == true ]]; then
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              expected_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              actual_digest="$(
                jq -r --arg name "$asset_name" \
                  '.assets[] | select(.name == $name) | .digest' \
                  <<<"$release_json"
              )"

              if [[ -z "$actual_digest" ]]; then
                gh release upload "$RELEASE_TAG" "$asset"
              elif [[ "$actual_digest" != "$expected_digest" ]]; then
                echo "Draft Release asset differs: $asset_name." >&2
                exit 1
              fi
            done

            release_json="$(
              gh release view "$RELEASE_TAG" \
                --json tagName,isDraft,isImmutable,isPrerelease,assets
            )"
            expected_assets="$(
              for asset in "${assets[@]}"; do
                basename "$asset"
              done | LC_ALL=C sort
            )"
            actual_assets="$(
              jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort
            )"
            if [[ "$actual_assets" != "$expected_assets" ]]; then
              echo "Draft Release assets differ from the qualified set." >&2
              exit 1
            fi

            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              expected_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
              actual_digest="$(
                jq -r --arg name "$asset_name" \
                  '.assets[] | select(.name == $name) | .digest' \
                  <<<"$release_json"
              )"

              if [[ "$actual_digest" != "$expected_digest" ]]; then
                echo "Draft Release asset digest differs: $asset_name." >&2
                exit 1
              fi
            done

            gh release edit "$RELEASE_TAG" \
              --draft=false \
              "${publication_arguments[@]}"
          fi

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --json tagName,isDraft,isImmutable,isPrerelease,assets
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag
              and .isDraft == false
              and .isImmutable == true
              and .isPrerelease == $prerelease' \
            <<<"$release_json" >/dev/null

          expected_assets="$(
            for asset in "${assets[@]}"; do
              basename "$asset"
            done | LC_ALL=C sort
          )"
          actual_assets="$(
            jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort
          )"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Published Release assets differ from the qualified set." >&2
            exit 1
          fi

          gh release verify "$RELEASE_TAG"
          for asset in "${assets[@]}"; do
            gh release verify-asset "$RELEASE_TAG" "$asset"
          done

          echo "SafeMigrations $PACKAGE_VERSION was published and verified." \
            >>"$GITHUB_STEP_SUMMARY"
