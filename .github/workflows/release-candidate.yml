name: Release candidate
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a leading v, for example 10.0.1.
        required: true
        type: string
      qualification-only:
        description: Qualify the selected line without requesting publication or its environment.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: safe-migrations-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate untagged candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      source-ref: ${{ steps.line.outputs.source-ref }}
      line-artifact-name: ${{ steps.line.outputs.line-artifact-name }}
      line-sha256: ${{ steps.line.outputs.line-sha256 }}
      publish-allowed: ${{ steps.line.outputs.publish-allowed }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: bash eng/validate-release-version.sh "$PACKAGE_VERSION"

      - name: Verify current untagged release-line source
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
          QUALIFICATION_ONLY: ${{ inputs.qualification-only }}
        run: >-
          python3 -m eng.release.publication preflight
          --version "$PACKAGE_VERSION"
          --qualification-only "$QUALIFICATION_ONLY"
          --output artifacts/release-lines/line.json

      - name: Require the candidate tag to remain absent
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release-tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Candidate qualification must finish before the release tag exists." >&2
            exit 1
          fi

      - name: Retain exact source-line qualification identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.line.outputs.line-artifact-name }}
          path: artifacts/release-lines/line.json
          if-no-files-found: error
          retention-days: 30

      - name: Require an unused NuGet version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          for package_id in \
            doka.entityframeworkcore.safemigrations \
            doka.entityframeworkcore.safemigrations.mysql \
            doka.entityframeworkcore.safemigrations.postgresql \
            doka.entityframeworkcore.safemigrations.sqlite \
            doka.entityframeworkcore.safemigrations.sqlserver; do
            package_url="https://api.nuget.org/v3-flatcontainer/$package_id"
            package_url+="/$PACKAGE_VERSION/$package_id.$PACKAGE_VERSION.nupkg"
            http_code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 --output /dev/null \
              --write-out '%{http_code}' "$package_url")"

            if [[ "$http_code" != 404 ]]; then
              echo "NuGet version must be unused; $package_id returned HTTP $http_code." >&2
              exit 1
            fi
          done

  quality-gates:
    name: Full reversible qualification
    needs: preflight
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: ${{ needs.preflight.outputs.package-version }}
      artifact-name: safe-migrations-release-${{ needs.preflight.outputs.package-version }}-${{ github.run_attempt }}
      artifact-retention-days: 30

  attest:
    name: Attest qualified packages
    needs:
      - preflight
      - quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      provenance_artifact_name: ${{ steps.provenance.outputs.provenance_artifact_name }}
    permissions:
      contents: read
      id-token: write           # Mints the short-lived Sigstore certificate.
      attestations: write       # Publishes build and SBOM attestations.
      artifact-metadata: write  # Links attestations to workflow artifacts.
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download qualified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.quality-gates.outputs.qualified-artifact-name }}
          path: artifacts

      - name: Verify qualified bytes
        env:
          PACKAGE_VERSION: ${{ needs.preflight.outputs.package-version }}
        run: |
          (
            cd artifacts/packages
            sha256sum --check SHA256SUMS
          )
          eng/verify-package-contents.sh \
            --package-dir artifacts/packages \
            --version "$PACKAGE_VERSION"

      - name: Attest build provenance
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS
            artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          sbom-path: artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

      - name: Materialize portable SLSA provenance
        id: provenance
        env:
          SAFE_MIGRATIONS_ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          provenance_bundle="artifacts/release-provenance/release-provenance.intoto.jsonl"
          provenance_arguments=(
            materialize
            --bundle "$SAFE_MIGRATIONS_ATTESTATION_BUNDLE"
            --output "$provenance_bundle"
          )
          for subject in \
            artifacts/packages/*.nupkg \
            artifacts/packages/*.snupkg \
            artifacts/packages/SHA256SUMS \
            artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json; do
            provenance_arguments+=(--subject "$subject")
          done

          bash eng/release-provenance.sh "${provenance_arguments[@]}"
          echo "provenance_artifact_name=safe-migrations-release-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"

      - name: Upload portable SLSA provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.provenance.outputs.provenance_artifact_name }}
          path: artifacts/release-provenance/release-provenance.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Verify tag and publish
    # WHY: Qualification-only must skip the environment-bearing job, not merely its upload steps.
    if: ${{ !inputs.qualification-only && needs.preflight.outputs.publish-allowed == 'true' }}
    needs:
      - preflight
      - quality-gates
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: safe-migrations-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: nuget
    permissions:
      actions: read    # Downloads the exact qualified workflow artifact.
      attestations: read  # Verifies the portable Sigstore bundle before publication.
      contents: write  # Creates or verifies the immutable GitHub Release.
      id-token: write  # Exchanges OIDC for a short-lived NuGet API key.
    env:
      PACKAGE_VERSION: ${{ needs.preflight.outputs.package-version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release-tag }}
      LINE_SHA256: ${{ needs.preflight.outputs.line-sha256 }}
      QUALIFIED_ARTIFACT_NAME: ${{ needs.quality-gates.outputs.qualified-artifact-name }}
      PROVENANCE_ARTIFACT_NAME: ${{ needs.attest.outputs.provenance_artifact_name }}
      SAFE_MIGRATIONS_PUBLICATION_LOCK_GROUP: safe-migrations-publication
      SAFE_MIGRATIONS_PUBLICATION_LOCK_HELD: '1'
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download qualified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.quality-gates.outputs.qualified-artifact-name }}
          path: artifacts

      - name: Download portable SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.attest.outputs.provenance_artifact_name }}
          path: artifacts/release-provenance

      - name: Download original source-line identity
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.preflight.outputs.line-artifact-name }}
          path: artifacts/release-lines

      - name: Verify source and authorized signed tag
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* \
              || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Publication must use the qualified release-line commit." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin \
            "+$GITHUB_REF:refs/remotes/origin/release-source"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release-source; then
            echo "The qualified commit is no longer on its protected release-line history." >&2
            exit 1
          fi

          git fetch --quiet --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag \
              || "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "The release tag must be annotated and identify the qualified commit." >&2
            exit 1
          fi

          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile=eng/release/allowed-signers \
            verify-tag "$RELEASE_TAG"

      - name: Verify qualified bytes again
        run: |
          (
            cd artifacts/packages
            sha256sum --check SHA256SUMS
          )
          eng/verify-package-contents.sh \
            --package-dir artifacts/packages \
            --version "$PACKAGE_VERSION"

      - name: Verify portable SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          provenance_bundle="artifacts/release-provenance/release-provenance.intoto.jsonl"
          subjects=(
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS
            artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json
          )
          provenance_arguments=(
            verify-github
            --bundle "$provenance_bundle"
            --repository "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml"
            --signer-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --source-digest "$GITHUB_SHA"
          )
          for subject in "${subjects[@]}"; do
            provenance_arguments+=(--subject "$subject")
          done

          bash eng/release-provenance.sh "${provenance_arguments[@]}"

      - name: Admit the exact candidate under current protected-main authority
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m eng.release.publication admit
          --line-file artifacts/release-lines/line.json
          --line-sha256 "$LINE_SHA256"
          --qualified-artifact-name "$QUALIFIED_ARTIFACT_NAME"
          --provenance-artifact-name "$PROVENANCE_ARTIFACT_NAME"
          --artifact-dir artifacts
          --output artifacts/release-lines/admission.json

      - name: Retain original publication admission
        if: steps.admission.outputs.admission-restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.admission.outputs.admission-artifact-name }}
          path: artifacts/release-lines/admission.json
          if-no-files-found: error
          retention-days: 30

      - name: Recheck current permission before creating public draft state
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA256: ${{ steps.admission.outputs.admission-sha256 }}
        run: >-
          python3 -m eng.release.publication recheck
          --line-file artifacts/release-lines/line.json
          --line-sha256 "$LINE_SHA256"
          --artifact-dir artifacts
          --admission artifacts/release-lines/admission.json
          --admission-sha256 "$ADMISSION_SHA256"

      - name: Prepare verified GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash eng/reconcile-github-release.sh
          stage "$PACKAGE_VERSION" "$RELEASE_TAG"

      - name: Check NuGet.org immediately before publication
        id: nuget-preflight
        run: |
          packages=(
            "core|doka.entityframeworkcore.safemigrations"
            "mysql|doka.entityframeworkcore.safemigrations.mysql"
            "postgresql|doka.entityframeworkcore.safemigrations.postgresql"
            "sqlite|doka.entityframeworkcore.safemigrations.sqlite"
            "sqlserver|doka.entityframeworkcore.safemigrations.sqlserver"
          )

          for descriptor in "${packages[@]}"; do
            IFS='|' read -r output_name package_id <<<"$descriptor"
            package_url="https://api.nuget.org/v3-flatcontainer/$package_id"
            package_url+="/$PACKAGE_VERSION/$package_id.$PACKAGE_VERSION.nupkg"
            published=""
            http_code=""

            for attempt in {1..4}; do
              if http_code="$(curl --silent --show-error --head --location \
                --connect-timeout 10 --max-time 60 --output /dev/null \
                --write-out '%{http_code}' "$package_url")"; then
                case "$http_code" in
                  200)
                    published=true
                    break
                    ;;
                  404)
                    published=false
                    break
                    ;;
                  408 | 429 | 5??) ;;
                  *)
                    echo "NuGet publication preflight failed for $package_id with HTTP $http_code." >&2
                    exit 1
                    ;;
                esac
              else
                curl_exit_code=$?
                http_code="transport-error (curl exit $curl_exit_code)"
              fi

              if ((attempt < 4)); then
                sleep $((attempt * 5))
              fi
            done

            if [[ -z "$published" ]]; then
              echo \
                "NuGet publication preflight remained unavailable for $package_id" \
                "after 4 attempts; last result: $http_code." >&2
              exit 1
            fi

            echo "${output_name}_published=$published" >>"$GITHUB_OUTPUT"
          done

      - name: Recheck current permission before NuGet credentials
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA256: ${{ steps.admission.outputs.admission-sha256 }}
        run: >-
          python3 -m eng.release.publication recheck
          --line-file artifacts/release-lines/line.json
          --line-sha256 "$LINE_SHA256"
          --artifact-dir artifacts
          --admission artifacts/release-lines/admission.json
          --admission-sha256 "$ADMISSION_SHA256"

      - name: Request short-lived NuGet.org key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish Core package
        if: steps.nuget-preflight.outputs.core_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.${{ env.PACKAGE_VERSION }}.nupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --no-symbols --skip-duplicate --timeout 300

      - name: Publish MySQL package
        if: steps.nuget-preflight.outputs.mysql_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.MySql.${{ env.PACKAGE_VERSION }}.nupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --no-symbols --skip-duplicate --timeout 300

      - name: Publish PostgreSQL package
        if: steps.nuget-preflight.outputs.postgresql_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: >-
            artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.${{ env.PACKAGE_VERSION }}.nupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --no-symbols --skip-duplicate --timeout 300

      - name: Publish SQLite package
        if: steps.nuget-preflight.outputs.sqlite_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.${{ env.PACKAGE_VERSION }}.nupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --no-symbols --skip-duplicate --timeout 300

      - name: Publish SQL Server package
        if: steps.nuget-preflight.outputs.sqlserver_published != 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: >-
            artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.${{ env.PACKAGE_VERSION }}.nupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --no-symbols --skip-duplicate --timeout 300

      - name: Publish Core symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.${{ env.PACKAGE_VERSION }}.snupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate --timeout 300

      - name: Publish MySQL symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.MySql.${{ env.PACKAGE_VERSION }}.snupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate --timeout 300

      - name: Publish PostgreSQL symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: >-
            artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.${{ env.PACKAGE_VERSION }}.snupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate --timeout 300

      - name: Publish SQLite symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.Sqlite.${{ env.PACKAGE_VERSION }}.snupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate --timeout 300

      - name: Publish SQL Server symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE: >-
            artifacts/packages/Doka.EntityFrameworkCore.SafeMigrations.SqlServer.${{ env.PACKAGE_VERSION }}.snupkg
        run: >-
          dotnet nuget push "$PACKAGE"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate --timeout 300

      - name: Verify public NuGet packages
        run: >-
          bash eng/readback-nuget.sh
          --package-dir artifacts/packages
          --version "$PACKAGE_VERSION"
          --timeout-seconds 1200

      - name: Publish or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_SHA256: ${{ steps.admission.outputs.admission-sha256 }}
        run: |
          python3 -m eng.release.publication recheck \
            --line-file artifacts/release-lines/line.json \
            --line-sha256 "$LINE_SHA256" \
            --artifact-dir artifacts \
            --admission artifacts/release-lines/admission.json \
            --admission-sha256 "$ADMISSION_SHA256"
          bash eng/reconcile-github-release.sh \
            publish "$PACKAGE_VERSION" "$RELEASE_TAG"
          echo "SafeMigrations $PACKAGE_VERSION was published and verified." \
            >>"$GITHUB_STEP_SUMMARY"
