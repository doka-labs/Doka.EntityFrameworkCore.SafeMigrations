name: Release

# Triggered by a version tag push, e.g. git tag v0.1.0 && git push --tags
# The package version is derived automatically from the Git tag — no manual edits needed.
# Requires the NUGET_USER repository secret to be set (your nuget.org profile name).
# Configure a Trusted Publishing policy on nuget.org for each package:
#   Repository Owner: doka-org  |  Repository: Doka.EntityFrameworkCore.SafeMigrations
#   Workflow File: release.yml  |  Environment: (leave empty)
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Doka.EntityFrameworkCore.SafeMigrations.slnx

      - name: Build
        run: dotnet build Doka.EntityFrameworkCore.SafeMigrations.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.Tests/Doka.EntityFrameworkCore.SafeMigrations.Tests.csproj
          --no-build --configuration Release

      - name: MariaDB integration tests
        run: >
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.MariaDb.Tests/Doka.EntityFrameworkCore.SafeMigrations.MariaDb.Tests.csproj
          --no-build --configuration Release

      - name: PostgreSQL integration tests
        run: >
          dotnet test
          tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests/Doka.EntityFrameworkCore.SafeMigrations.PostgreSql.Tests.csproj
          --no-build --configuration Release

  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write  # Required for NuGet trusted publishing (OIDC token exchange)
      contents: write  # Required to create a GitHub Release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Derive package version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Doka.EntityFrameworkCore.SafeMigrations.slnx

      - name: Build
        run: dotnet build Doka.EntityFrameworkCore.SafeMigrations.slnx --no-restore --configuration Release

      - name: Pack
        run: >
          dotnet pack Doka.EntityFrameworkCore.SafeMigrations.slnx
          --no-build --configuration Release
          --output ./artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544  # v1.1.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish symbol packages to NuGet
        run: >
          dotnet nuget push ./artifacts/*.snupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nuget-packages
          path: artifacts/

      - name: Create GitHub Release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: `See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) for release notes.`,
              draft: false,
              prerelease: tag.includes('-')
            });
