name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: safe-migrations-release
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate immutable release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable SemVer tag and main ancestry
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be stable SemVer in the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release commit is not reachable from origin/main." >&2
            exit 1
          fi
          package_version="${GITHUB_REF_NAME#v}"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify NuGet publication endpoint
        shell: bash
        run: |
          for package_id in \
            doka.entityframeworkcore.safemigrations \
            doka.entityframeworkcore.safemigrations.mysql \
            doka.entityframeworkcore.safemigrations.postgresql; do
            package_url="https://api.nuget.org/v3-flatcontainer/$package_id/${{ steps.version.outputs.package-version }}/$package_id.${{ steps.version.outputs.package-version }}.nupkg"
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$package_url")"
            case "$status" in
              200|404) ;;
              *)
                echo "NuGet returned HTTP $status while checking $package_id." >&2
                exit 1
                ;;
            esac
          done

  quality-gates:
    name: Full release qualification
    needs: validate-tag
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
    with:
      package-version: ${{ needs.validate-tag.outputs.package-version }}
      artifact-name: safe-migrations-release-${{ needs.validate-tag.outputs.package-version }}-${{ github.run_attempt }}
      artifact-retention-days: 90
      require-stable-dependencies: true

  publish:
    name: Attest, publish, and verify
    needs:
      - validate-tag
      - quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag.outputs.package-version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Download the qualified bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safe-migrations-release-${{ needs.validate-tag.outputs.package-version }}-${{ github.run_attempt }}
          path: artifacts

      - name: Verify downloaded qualification evidence
        shell: bash
        run: |
          (
            cd artifacts/packages
            sha256sum --check SHA256SUMS
          )
          eng/verify-package-contents.sh \
            --package-dir artifacts/packages \
            --version "$PACKAGE_VERSION" \
            --require-stable-dependencies

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS

      - name: Attest SPDX SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          sbom-path: artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json

      - name: Preserve attestation bundles
        shell: bash
        run: |
          mkdir -p artifacts/attestations
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            artifacts/attestations/build-provenance.sigstore.json
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            artifacts/attestations/sbom-attestation.sigstore.json

      - name: Exchange GitHub OIDC token for NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish missing packages or verify exact existing bytes
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: >-
          eng/publish-nuget.sh
          --package-dir artifacts/packages
          --version "$PACKAGE_VERSION"

      - name: Verify NuGet repository signatures and content readback
        run: |
          mkdir -p artifacts/nuget-readback
          eng/readback-nuget.sh \
            --package-dir artifacts/packages \
            --output artifacts/nuget-readback \
            --version "$PACKAGE_VERSION"

      - name: Upload signed NuGet readback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-migrations-nuget-readback-${{ needs.validate-tag.outputs.package-version }}
          path: artifacts/nuget-readback
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Create verified GitHub Release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const path = require('path');
            const { reconcileRelease } = require('./eng/release/github-release.js');
            const tag = process.env.RELEASE_TAG;
            const assetPaths = [
              ...require('fs').readdirSync('artifacts/packages')
                .filter((name) => name.endsWith('.nupkg') || name.endsWith('.snupkg') || name === 'SHA256SUMS')
                .map((name) => path.join('artifacts/packages', name)),
              'artifacts/sbom/_manifest/spdx_2.2/manifest.spdx.json',
              'artifacts/attestations/build-provenance.sigstore.json',
              'artifacts/attestations/sbom-attestation.sigstore.json',
              'artifacts/nuget-readback/SIGNED_SHA256SUMS'
            ];
            await reconcileRelease({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              targetCommitish: context.sha,
              name: tag,
              body: `See [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${tag}/CHANGELOG.md).`,
              assetPaths
            });
