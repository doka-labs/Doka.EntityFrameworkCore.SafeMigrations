name: scorecard

# Publishes an independent supply-chain assessment of this repository. The
# score is produced by OpenSSF from observable repository state, not from the
# project's own claims, which makes it external evidence for maintainers and
# users without conflating it with the Best Practices self-assessment.

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 1"

permissions:
  contents: read

concurrency:
  # Only the latest default-branch state is publishable evidence. A newer
  # revision therefore supersedes an older scan that has not completed yet.
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    # workflow_dispatch lets GitHub offer any repository branch. Only the
    # default branch is valid publishable project evidence.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      security-events: write # Uploads SARIF to the code-scanning surface.
      id-token: write # Authenticates the result published to OpenSSF.
      contents: read # Reads repository state and checks out the source tree.
      actions: read # Lets Scorecard inspect CI evidence and workflow runs.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Retained independently of the code-scanning upload so a failed or
      # rate-limited upload still leaves the reviewed evidence available.
      - name: Upload result artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Upload result to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
